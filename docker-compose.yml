services:
  web:
    build:
      context: ./crux-app
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: node:22-alpine
        NGINX_IMAGE: nginx:alpine
    container_name: crux-frontend
    ports:
      - "3000:80"
    environment:
      - BACKEND_URL=host.docker.internal:8000
    # コンテナからホストのバックエンド（例: localhost:8000）へアクセスするため（Linux でも host.docker.internal を使えるようにする）
    extra_hosts:
      - "host.docker.internal:host-gateway"
